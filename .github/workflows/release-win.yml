name: Build Windows
on:
  push:
    tags:
      - 'v*'
jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Download FFmpeg
        run: |
          curl -L "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -o ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-temp
          New-Item -ItemType Directory -Force -Path ffmpeg
          Copy-Item "ffmpeg-temp\ffmpeg-*\bin\ffmpeg.exe" "ffmpeg\ffmpeg.exe"
          Remove-Item -Recurse -Force ffmpeg-temp
          Remove-Item ffmpeg.zip
      - name: Build Windows EXE
        run: npx electron-builder build --win --publish never
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          token: ${{ secrets.GITHUB_TOKEN }}
