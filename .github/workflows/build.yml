name: Build Mac
on:
  push:
    tags:
      - 'v*'
jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Download FFmpeg for Mac
        run: |
          mkdir -p ffmpeg
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg/ffmpeg.zip
          unzip ffmpeg/ffmpeg.zip -d ffmpeg/
          rm ffmpeg/ffmpeg.zip
          chmod +x ffmpeg/ffmpeg
      - name: Build Mac Universal DMG
        run: npx electron-builder build --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
