name: Build Mac
on:
  push:
    tags:
      - 'v*'
jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Bundle universal ffmpeg (Intel + Apple Silicon)
        run: |
          curl -L "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64" -o /tmp/ffmpeg-x64
          chmod +x /tmp/ffmpeg-x64
          curl -L "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64" -o /tmp/ffmpeg-arm64
          chmod +x /tmp/ffmpeg-arm64
          lipo -create /tmp/ffmpeg-x64 /tmp/ffmpeg-arm64 -output node_modules/ffmpeg-static/ffmpeg
          chmod +x node_modules/ffmpeg-static/ffmpeg
          file node_modules/ffmpeg-static/ffmpeg
      - name: Build Mac Universal DMG
        run: npx electron-builder build --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
