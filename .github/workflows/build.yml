name: Build Mac
on:
  push:
    tags:
      - 'v*'
jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Download FFmpeg for Mac (x64 + arm64)
        run: |
          mkdir -p ffmpeg
          # Download x64 FFmpeg
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg_x64.zip
          unzip ffmpeg_x64.zip -d ffmpeg_x64_tmp/
          cp ffmpeg_x64_tmp/ffmpeg ffmpeg/ffmpeg-x64
          chmod +x ffmpeg/ffmpeg-x64
          rm -rf ffmpeg_x64.zip ffmpeg_x64_tmp/
          # Download arm64 FFmpeg
          curl -L "https://www.osxexperts.net/ffmpeg7arm.zip" -o ffmpeg_arm64.zip
          unzip ffmpeg_arm64.zip -d ffmpeg_arm64_tmp/
          cp ffmpeg_arm64_tmp/ffmpeg ffmpeg/ffmpeg-arm64
          chmod +x ffmpeg/ffmpeg-arm64
          rm -rf ffmpeg_arm64.zip ffmpeg_arm64_tmp/
      - name: Build Mac Universal DMG
        run: npx electron-builder build --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
